name: Application Android (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Remplacer l'icône
        run: |
          pip install pillow
          python3 scripts/android_icons.py

      - name: Copier l'application dans le projet Android
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk partage-cie.apk

      - name: Garder une copie dans les artefacts du workflow
        uses: actions/upload-artifact@v4
        with:
          name: partage-cie-apk
          path: partage-cie.apk

      - name: Publier l'APK dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-dernier --yes --cleanup-tag || true
          gh release create apk-dernier partage-cie.apk \
            --title "Partage CIE (dernier APK)" \
            --notes "Téléchargez partage-cie.apk sur votre téléphone Android et ouvrez-le pour installer l'application."
